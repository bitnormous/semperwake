name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check every shell script
        run: |
          for f in install.sh semperwake docker/entrypoint.sh test/run-tests.sh; do
            echo "-- $f"
            bash -n "$f"
          done

      - name: Run the test suite
        # Hermetic: stubs tmux/systemctl/loginctl/claude/jq/curl and installs
        # into a throwaway HOME. Touches no systemd units and makes no network calls.
        run: ./test/run-tests.sh

      - name: Build the Docker image
        run: docker build -t semperwake .
